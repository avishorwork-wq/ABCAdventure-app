<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ABC private setup</title><main><h1>ABC private setup</h1><p>Preparation only. This does not change your adventures.</p><form><label>Private unlock <input type="password" id="key" autocomplete="off" required></label><button>Prepare check</button></form><output id="out"></output></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('key').value));document.getElementById('key').value='';document.getElementById('out').textContent=Array.from(new Uint8Array(b)).map(n=>n.toString(16).padStart(2,'0')).join('')};</script>
